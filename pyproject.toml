[project]
name = "llm-otel"
version = "0.1.0"
description = "LiteLLM proxy with per-run OpenTelemetry-style metrics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "litellm[proxy]>=1.83.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["proxy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
